<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AI STUDIO — Сериалы и видео по сериям</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #cbd5e1; }
        input[type="text"], textarea, select, input[type="file"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        input[type="file"] { cursor: pointer; padding: 9px; }
        button { background: #0ea5e9; color: white; border: none; padding: 14px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0284c7; }
        #result { margin-top: 25px; padding: 15px; background: #0f172a; border-radius: 8px; border: 1px solid #334155; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI STUDIO: Генератор Сериалов</h1>
        
        <div class="form-group">
            <label>Название сериала или проекта:</label>
            <input type="text" id="showTitle" placeholder="Например: Киберпанк: Новая эра">
        </div>

        <div class="form-group">
            <label>Номер серии / Продолжение сюжета:</label>
            <input type="text" id="episodeNum" value="Серия 1: Начало" placeholder="Серия 1, Серия 2...">
        </div>

        <div class="form-group">
            <label>Внешность персонажей (текстовое описание):</label>
            <textarea id="characters" rows="3" placeholder="Главный герой: парень 25 лет, шрам на левой брови, кибернетическая рука..."></textarea>
        </div>

        <div class="form-group">
            <label>Загрузить фото / референс персонажа:</label>
            <input type="file" id="charImage" accept="image/*">
        </div>

        <div class="form-group">
            <label>Сценарий текущей серии (диалоги, движения, сцена):</label>
            <textarea id="prompt" rows="4" placeholder="Сцена 1: Герой заходит в неоновый бар..."></textarea>
        </div>

        <button onclick="generateEpisode()">Запустить генерацию серии</button>

        <div id="result" style="display:none;"></div>
    </div>

    <script>
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function generateEpisode() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '⏳ Обработка фото, отправка задания и связывание персонажей...';

            const fileInput = document.getElementById('charImage');
            let imageBase64 = null;
            if (fileInput.files && fileInput.files[0]) {
                try {
                    imageBase64 = await fileToBase64(fileInput.files[0]);
                } catch (e) {
                    console.error("Ошибка чтения файла", e);
                }
            }

            const data = {
                title: document.getElementById('showTitle').value,
                episode: document.getElementById('episodeNum').value,
                characters: document.getElementById('characters').value,
                characterImage: imageBase64,
                prompt: document.getElementById('prompt').value
            };
            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const res = await response.json();
                
                if (res.success) {
                    resultDiv.innerHTML = ✅ ${res.message}\n\n📦 Данные серии переданы в Cloudflare Worker:\n- Проект: ${res.episodeData.title}\n- Эпизод: ${res.episodeData.episode}\n- Фото персонажа загружено: ${imageBase64 ? 'Да' : 'Нет'}\nГенерация видеоряда запущена!;
                } else {
                    resultDiv.innerHTML = ❌ Ошибка: ${res.error};
                }
            } catch (err) {
                resultDiv.innerHTML = ❌ Ошибка сети: ${err.message};
            }
        }
    </script>
</body>
</html>
